name: Test

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tool source
    steps:
      - uses: actions/checkout@v4
        with:
          path: tool source
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/crapper
          ref: b3e47fc12df0c30403374329fc1bbd77f3546f75
          path: crapper
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]' -e ../crapper
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip install -e '.[dev]' -e ../crapper
          exit $LASTEXITCODE
      - name: Test
        if: runner.os != 'Windows'
        run: .venv/bin/python -m pytest
      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -m pytest
          exit $LASTEXITCODE
